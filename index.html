<!DOCTYPE html>

    <title>FORM SUBMISSION</title>
</head>
<body> 
    <h2>Student Registration Form</h2>
    <form action="">
        <label for=""> Full Name:</label> <br>
        <input type="text" placeholder="Enter your Name" required>
        <br>
         <br>
        <label for="">Email:</label> <br>
        <input type="email"  placeholder="Enter your email"     required>
         <br>
         <br>
        <label for="">Password:</label> <br>
        <input type="password" required>
        <br>
        <p>Gender:</p>
        <label for="male"><input type="radio" name="Gender" id="male" required>Male</label>
        <label for="female"><input type="radio" name="Gender" id="female" required>Female</label><br>
        <p>Skills:</p>
        <label for="abc"> <input type="checkbox"  name="Skills" id="abc" >HTML </label>
        <label for="adc"> <input type="checkbox" name="Skills" id="adc" >CSS </label>
        <label for="aec"> <input type="checkbox"  name="Skills" id="aec" >JavaScript </label>
        <br>
        <br>
        <label for="">Date Of Birth:</label>
        <input type="date" required>
        <br>
        
        <button type="submit">Register</button>
        <br>
    </form>
